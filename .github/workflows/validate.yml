name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check list format
        run: python3 -I tools/validate.py
      # Самопроверка склейки на местных образцах: сеть не нужна, порядок своих
      # добавок и отказы при пустом источнике проверяются здесь.
      - name: self-check the merge
        run: python3 -I tools/selftest.py
